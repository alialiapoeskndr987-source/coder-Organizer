name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build release APKs (CI = بيئة البناء — قرار D-019)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter 3.47.6 stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.6
          cache: true

      - name: Show toolchain
        run: |
          flutter --version
          flutter doctor

      # ملاحظة: android/.gitignore يستبعد gradlew وgradlew.bat وgradle-wrapper.jar
      # افتراضياً — تُستعاد هنا بمطابقة إصدار Gradle 9.3.1 المحدد في
      # gradle/wrapper/gradle-wrapper.properties قبل أي استدعاء لـ flutter build.
      - name: Restore Gradle wrapper (gitignored files)
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL -o gradle.zip https://services.gradle.org/distributions/gradle-9.3.1-bin.zip
          unzip -q gradle.zip
          mkdir wrapper-gen && cd wrapper-gen
          "$RUNNER_TEMP/gradle-9.3.1/bin/gradle" wrapper --gradle-version 9.3.1 --distribution-type all
          cp gradlew gradlew.bat "$GITHUB_WORKSPACE/android/"
          cp gradle/wrapper/gradle-wrapper.jar "$GITHUB_WORKSPACE/android/gradle/wrapper/"
          chmod +x "$GITHUB_WORKSPACE/android/gradlew"
          ( cd "$GITHUB_WORKSPACE/android" && ./gradlew --version )

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze (must be clean)
        run: flutter analyze

      - name: Tests (must pass)
        run: flutter test

      - name: Build universal APK (all ABIs)
        run: flutter build apk --release

      - name: Build arm64 split APK
        run: flutter build apk --release --split-per-abi --target-platform android-arm64

      - name: Organize outputs + checksums
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' android/app/build.gradle.kts)
          CODE=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' android/app/build.gradle.kts)
          echo "Packaging v${VERSION} (versionCode $CODE)"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/coder-organizer-v${VERSION}-release.apk"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "dist/coder-organizer-v${VERSION}-arm64.apk"
          ( cd dist && sha256sum *.apk > SHA256SUMS.txt )
          ls -la dist

      - name: Upload APKs artifact
        uses: actions/upload-artifact@v4
        with:
          name: coder-organizer-apks
          path: dist/*
          if-no-files-found: error
          retention-days: 30
